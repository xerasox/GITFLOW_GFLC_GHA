
name: Test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Proceed'
        required: true
        default: 'Yes'
        type: choice
        options:
          - Yes
          - No

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  Test-JIRA:
    # The type of runner that the job will run on
    runs-on: [ISPW]
    steps:
    # Runs a set of commands using the runners shell
    - name: Get Issue Info
      shell: pwsh
      run: |

        Invoke-WebRequest -Uri "http://192.168.96.133:8080/job/XAVIER_DEMOS/job/GITFLOW_GFLC_CI/buildWithParameters?" `
                            -Method POST `
                            -ContentType "application/json"

        
