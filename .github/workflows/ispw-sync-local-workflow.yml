name: code-pipeline-sync-local

on: 
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Proceed'
        required: true
        default: 'Yes'
        type: choice
        options:
          - Yes
          - No
      reuse_sync:
        description: 'Reuse previously generated sync JSON without running sync'
        required: false
        default: 'No'
        type: choice
        options:
          - Yes
          - No
permissions:
    checks: write
    contents: read
    
jobs:

  # Feature Branch CI event
  Feature-branch-event:
   if: (startsWith(github.ref, 'refs/heads/feature/'))
   runs-on: [ISPW]
   steps:
      # Prompt Event
      - name: Feature Branch Event
        run: echo "Active Branch has been modified, Branch CI triggered."

  Build:
   needs: Feature-branch-event
   runs-on: [ISPW]
   outputs:
    ASSIGNMENT_ID: ${{ steps.checkbuild.outputs.ASSIGNMENT_ID }}
    ISSUE_KEY: ${{ steps.checkbuild.outputs.ISSUE_KEY }}
    LAST_COMMIT: ${{ steps.getLastCommit.outputs.LAST_COMMIT }}
    ACTIVE_COMMIT: ${{ steps.getActiveCommit.outputs.ACTIVE_COMMIT }}
   env:
    Win_Topaz_Location: ${{ vars.CLI_LOCATION }}
   steps:
      # Checkout the repository first 
      - name: Checkout repository
        uses: actions/checkout@v3

      # Compute filesystem-safe artifact name (replace / with -)
      - name: Compute artifact name
        id: set-artifact-name
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          $safe = $ref -replace '/','-'
          $name = "automaticBuildParams-$safe"
          Write-Host "Computed artifact name: $name"
          Add-Content -Path $env:GITHUB_ENV -Value "ARTIFACT_NAME=$name"
        
      # Get last commit hash from develop branch
      - name: Get active commit hash
        id: getActiveCommit
        run: |
          $active_commit = git rev-parse HEAD
          echo "Active commit on develop: $ACTIVE_COMMIT"
          echo "ACTIVE_COMMIT=$active_commit" >> $env:GITHUB_OUTPUT

      # Restore cached automaticBuildParams.txt (persist JSON between runs)
      - name: Restore automaticBuildParams cache
        uses: actions/cache@v4
        with:
          path: automaticBuildParams.txt
          key: ispw-automaticBuildParams-${{ github.ref }}-stable

      # Download persisted automaticBuildParams artifact when reusing sync
      - name: Download automaticBuildParams artifact
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reuse_sync == 'Yes' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .

      # Optionally reuse cached automaticBuildJson instead of running sync
      - name: Use cached automaticBuildJson
        id: sync_cached
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reuse_sync == 'Yes' }}
        shell: pwsh
        run: |
          if (Test-Path -Path .\automaticBuildParams.txt -PathType Leaf) {
            $json = Get-Content .\automaticBuildParams.txt -Raw
            Add-Content -Path $env:GITHUB_OUTPUT -Value "automaticBuildJson<<EOF"
            Add-Content -Path $env:GITHUB_OUTPUT -Value $json
            Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"
            Write-Host "Reused cached automaticBuildParams.txt as automaticBuildJson"
          } else {
            Write-Host "No cached automaticBuildParams.txt found; cannot reuse sync"
            exit 1
          }

      # ISPW Sync (run when not reusing cached JSON)
      - name: Run local action
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.reuse_sync != 'Yes' }}
        uses: bmc-compuware/ispw-sync-local@main
        id: sync
        with:
          host: ${{ vars.HCI_HOST }}
          port: ${{ vars.HCI_PORT }}
          uid: ${{ vars.TSO_USER }}
          pass: ${{ secrets.TSO_TOKEN }}
          runtimeConfiguration: ${{ vars.CP_RUNTIME }}
          stream: ${{ vars.CP_STREAM }}
          application: ${{ vars.CP_APPL }}
          subAppl: ${{ vars.CP_SUBAPPL }}
          checkoutLevel: 'FEAT'
          gitUid: ${{ vars.GIT_USERID }}
          gitToken: ${{ secrets.GIT_TOKEN }}
          winTopazPath: ${{ env.Win_Topaz_Location }}
          containerCreation: 'per-branch'
          showEnv: true
          assignmentPrefix: ${{ vars.CP_ASSIGNPREFIX }}
          ispwConfigPath: ${{ vars.CP_CONFIG }}

      # Persist automaticBuildParams as artifact for future reuse
      - name: Upload automaticBuildParams artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: automaticBuildParams.txt
          if-no-files-found: ignore
          overwrite: true

      

      # Build Parameters retrieve
      - name: Get Automatic build parameters
        id: parms
        run:  |
          echo "automaticBuilJson=${{ steps.sync_final.outputs.automaticBuildJson }}"

      # Consolidate automaticBuildJson: prefer live sync output, then cached output, then file
      - name: Consolidate automaticBuildJson
        id: sync_final
        shell: pwsh
        run: |
          $syncOut = '${{ steps.sync.outputs.automaticBuildJson }}'
          $cachedOut = '${{ steps.sync_cached.outputs.automaticBuildJson }}'
          $fileOut = ''
          if (Test-Path -Path .\automaticBuildParams.txt -PathType Leaf) {
            $fileOut = Get-Content .\automaticBuildParams.txt -Raw
          }

          if ($syncOut -and $syncOut -ne 'null' -and $syncOut -ne '') {
            $selected = $syncOut
            Write-Host "Selected automaticBuildJson from live sync"
          } elseif ($cachedOut -and $cachedOut -ne 'null' -and $cachedOut -ne '') {
            $selected = $cachedOut
            Write-Host "Selected automaticBuildJson from cached step"
          } elseif ($fileOut -and $fileOut -ne '') {
            $selected = $fileOut
            Write-Host "Selected automaticBuildJson from file"
          } else {
            $selected = ''
            Write-Host "No automaticBuildJson found from sync, cache, or file"
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "automaticBuildJson<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $selected
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

      # Check Build Parameters
      - name: Check Build Parms
        shell: pwsh
        id: checkbuild
        run: |
            if (-not (Test-Path -Path .\automaticBuildParams.txt -PathType Leaf)) {
                Write-Host "No Mainframe Build parameters were found. Likely, no MF components were modified. The build will continue and just execute a code scan."
                Write-Host "##vso[task.complete result=Failed;]DONE"
            } else {
                Write-Host "Mainframe Build parameters were found. Will continue with full Mainframe Build process."
                $fileContent = Get-Content .\automaticBuildParams.txt -Raw
                $json = ConvertFrom-JSON $fileContent

                $taskParm = ($json.taskIds -join ",")
                $taskLevel = $json.taskLevel
                $assignmentId = $json.containerId

                Write-Host "Identified Tasks: $taskParm"
                Write-Host "Assignment ID: $assignmentId"
                Write-Host "Level: $taskLevel"

                Write-Host "##vso[task.setvariable variable=taskIds;isoutput=true]$taskParm"
                Write-Host "##vso[task.setvariable variable=taskLevel;isoutput=true]$taskLevel"
                Write-Host "##vso[task.setvariable variable=assignmentId;isoutput=true]$assignmentId"

                # Get the active branch name from workflow context
                $branchName = '${{ github.ref_name }}'

                # Split by '/' and get the last part
                $issueKey = $branchName -split '/' | Select-Object -Last 1

                echo "ASSIGNMENT_ID=$assignmentId" >> $env:GITHUB_OUTPUT
                echo "ISSUE_KEY=$issueKey" >> $env:GITHUB_OUTPUT
                # expose raw build json for downstream steps (multiline safe)
                Add-Content -Path $env:GITHUB_OUTPUT -Value "BuildJSON<<EOF"
                Add-Content -Path $env:GITHUB_OUTPUT -Value $fileContent
                Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

            }    
      
      # Checkout develop branch
      - name: Checkout develop branch
        if: ${{ !steps.checkbuild.outputs.ASSIGNMENT_ID || steps.checkbuild.outputs.ASSIGNMENT_ID == 'null' }}
        uses: actions/checkout@v4
        with:
          ref: develop

      # Get last commit hash from develop branch
      - name: Get last commit hash
        if: ${{ !steps.checkbuild.outputs.ASSIGNMENT_ID || steps.checkbuild.outputs.ASSIGNMENT_ID == 'null' }}
        id: getLastCommit
        run: |
          $last_commit = git rev-parse HEAD
          echo "Last commit on develop: $LAST_COMMIT"
          echo "LAST_COMMIT=$last_commit" >> $env:GITHUB_OUTPUT

      # Checkout the repository first 
      - name: Checkout repository
        if: ${{ !steps.checkbuild.outputs.ASSIGNMENT_ID || steps.checkbuild.outputs.ASSIGNMENT_ID == 'null' }} 
        uses: actions/checkout@v3
          
      # Re-run sync if build parameters exist !
      - name: Re-run sync if first build
        if: ${{ !steps.checkbuild.outputs.ASSIGNMENT_ID || steps.checkbuild.outputs.ASSIGNMENT_ID == 'null' }}
        uses: bmc-compuware/ispw-sync-local@main
        id: re-sync
        with:
          host: ${{ vars.HCI_HOST }}
          port: ${{ vars.HCI_PORT }}
          uid: ${{ vars.TSO_USER }}
          pass: ${{ secrets.TSO_TOKEN }}
          runtimeConfiguration: ${{ vars.CP_RUNTIME }}
          stream: ${{ vars.CP_STREAM }}
          application: ${{ vars.CP_APPL }}
          subAppl: ${{ vars.CP_SUBAPPL }}
          checkoutLevel: 'FEAT'
          gitUid: ${{ vars.GIT_USERID }}
          gitToken: ${{ secrets.GIT_TOKEN }}
          winTopazPath: ${{ env.Win_Topaz_Location }}
          containerCreation: 'per-branch'
          showEnv: true
          assignmentPrefix: ${{ vars.CP_ASSIGNPREFIX }}
          ispwConfigPath: ${{ vars.CP_CONFIG }}
          gitCommit : ${{ steps.getActiveCommit.outputs.ACTIVE_COMMIT }}
          gitFromHash : ${{ steps.getLastCommit.outputs.LAST_COMMIT }}

      # Persist automaticBuildParams from re-sync as artifact
      - name: Upload automaticBuildParams artifact (re-sync)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: automaticBuildParams.txt
          if-no-files-found: ignore
          overwrite: true

      # Build Parameters retrieve
      - name: Get Automatic build parameters
        if: ${{ !steps.checkbuild.outputs.ASSIGNMENT_ID || steps.checkbuild.outputs.ASSIGNMENT_ID == 'null' }}
        id: parms2
        run:  |
          echo "automaticBuilJson=${{ steps.sync_final.outputs.automaticBuildJson }}"

      # Check Build Parameters
      - name: Check Build Parms
        shell: pwsh
        if: ${{ !steps.checkbuild.outputs.ASSIGNMENT_ID || steps.checkbuild.outputs.ASSIGNMENT_ID == 'null' }}
        id: checkbuild2
        run: |
            if (-not (Test-Path -Path .\automaticBuildParams.txt -PathType Leaf)) {
                Write-Host "No Mainframe Build parameters were found. Likely, no MF components were modified. The build will continue and just execute a code scan."
                Write-Host "##vso[task.complete result=Failed;]DONE"
            } else {
                Write-Host "Mainframe Build parameters were found. Will continue with full Mainframe Build process."
                $fileContent = Get-Content .\automaticBuildParams.txt -Raw
                $json = ConvertFrom-JSON $fileContent

                $taskParm = ($json.taskIds -join ",")
                $taskLevel = $json.taskLevel
                $assignmentId = $json.containerId

                Write-Host "Identified Tasks: $taskParm"
                Write-Host "Assignment ID: $assignmentId"
                Write-Host "Level: $taskLevel"

                Write-Host "##vso[task.setvariable variable=taskIds;isoutput=true]$taskParm"
                Write-Host "##vso[task.setvariable variable=taskLevel;isoutput=true]$taskLevel"
                Write-Host "##vso[task.setvariable variable=assignmentId;isoutput=true]$assignmentId"

                # Get the active branch name from workflow context
                $branchName = '${{ github.ref_name }}'

                # Split by '/' and get the last part
                $issueKey = $branchName -split '/' | Select-Object -Last 1

                echo "ASSIGNMENT_ID=$assignmentId" >> $env:GITHUB_OUTPUT
                echo "ISSUE_KEY=$issueKey" >> $env:GITHUB_OUTPUT
                # expose raw build json for downstream steps (multiline safe)
                Add-Content -Path $env:GITHUB_OUTPUT -Value "BuildJSON<<EOF"
                Add-Content -Path $env:GITHUB_OUTPUT -Value $fileContent
                Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

            }    

      # Get Issue Info from Jira related to this branch
      - name: Get Issue Info
        shell: pwsh
        run: |
          $User = "eraso.xavier@gmail.com"
          $Token = "${{ secrets.PERSONAL_JIRA_TOKEN }}"
          $EncodedAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${User}:${Token}"))

          $assignment = "NOTFOUND"
          # Derive issue key directly from the branch name to avoid detached HEAD problems
          $branchName = '${{ github.ref_name }}'
          $issueKey = ($branchName -split '/') | Select-Object -Last 1

          if (-not $issueKey -or $issueKey -eq 'null' -or $issueKey -eq '') {
            Write-Host "No issue key available; setting ASSIGNMENT=NOTFOUND"
            Add-Content -Path $env:GITHUB_ENV -Value "ASSIGNMENT=$assignment"
            exit 0
          }

          # Attempt request but never let an HTTP error abort the step
          $response = $null
          try {
            $response = Invoke-WebRequest -Uri "${{ vars.JIRA_URL }}/rest/api/3/issue/$issueKey" `
                        -Method GET `
                        -Headers @{
                          'Accept' = 'application/json'
                          'Authorization' = "Basic $EncodedAuth"
                        } `
                        -ErrorAction Stop
          } catch {
            Write-Host ("Warning: Jira GET failed: {0}" -f $_.Exception.Message)
            $response = $null
          }

          if ($response -and $response.Content) {
            try {
              $json = $response.Content | ConvertFrom-Json
              if ($json.fields.PSObject.Properties.Name -contains 'customfield_10041' -and -not [string]::IsNullOrWhiteSpace([string]$json.fields.customfield_10041)) {
                $assignment = [string]$json.fields.customfield_10041
                Write-Host "Extracted custom field value: $assignment"
              } else {
                Write-Host "customfield_10041 missing or empty in Jira response; using NOTFOUND"
              }
            } catch {
              Write-Host "Warning: could not parse Jira response as JSON; using NOTFOUND"
            }
          } else {
            Write-Host "No Jira response content; setting ASSIGNMENT=NOTFOUND"
          }

          # Save result to environment and continue
          Add-Content -Path $env:GITHUB_ENV -Value "ASSIGNMENT=$assignment"

      # Resolve final ISSUE_KEY for Jira actions (prefer step outputs, else derive from branch)
      - name: Resolve ISSUE_KEY
        id: resolve_issue
        shell: pwsh
        run: |
          $issueFromSteps = '${{ steps.checkbuild2.outputs.ISSUE_KEY || steps.checkbuild.outputs.ISSUE_KEY }}'
          if (-not $issueFromSteps -or $issueFromSteps -eq 'null' -or $issueFromSteps -eq '') {
            $branch = '${{ github.ref_name }}'
            $issue = ($branch -split '/') | Select-Object -Last 1
            Write-Host "Derived ISSUE_KEY from branch: $issue"
          } else {
            $issue = $issueFromSteps
            Write-Host "Using ISSUE_KEY from step outputs: $issue"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "ISSUE_KEY=$issue"
      
      # Set Assignment ID in the issue
      - name: Set Issue Assignment ID
        if: ${{ env.ASSIGNMENT == '' || env.ASSIGNMENT == 'null' || env.ASSIGNMENT == 'NOTFOUND' }}
        shell: pwsh
        run: |
              $User = "${{ vars.JIRA_USER }}"
              $Token = "${{ secrets.PERSONAL_JIRA_TOKEN }}"  # Replace with your actual API token
              $EncodedAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${User}:${Token}"))
              $assignmentId = "${{ steps.checkbuild2.outputs.ASSIGNMENT_ID || steps.checkbuild.outputs.ASSIGNMENT_ID }}"
              $issueKey = '${{ env.ISSUE_KEY }}'

              if (-not $issueKey -or $issueKey -eq 'null' -or $issueKey -eq '') {
                Write-Host "No ISSUE_KEY available; skipping Jira assignment PUT"
                exit 0
              }

                # Prepare the request body in JSON format
                $body = @{
                  fields = @{
                    customfield_10041 = $assignmentId
                  }
                } | ConvertTo-Json -Depth 3

              # Send the PUT request to Jira API
              try {
                $response = Invoke-WebRequest -Uri "${{ vars.JIRA_URL }}/rest/api/3/issue/$issueKey" `
                    -Method PUT `
                    -Headers @{
                        'Accept' = 'application/json'
                        'Authorization' = "Basic $EncodedAuth"
                    } `
                    -Body $body `
                    -ContentType 'application/json' `
                    -ErrorAction Stop
              } catch {
                Write-Host ("Warning: Jira PUT failed for issue {0}: {1}" -f $issueKey, $_.Exception.Message)
              }

      # Create associated comment
      - name: Update Issue Comment
        if: ${{ env.ASSIGNMENT == '' || env.ASSIGNMENT == 'null' || env.ASSIGNMENT == 'NOTFOUND' }}
        shell: pwsh
        run: |
            $User = "${{ vars.JIRA_USER }}"
            $Token = "${{ secrets.PERSONAL_JIRA_TOKEN }}"  # Replace with your actual API token
            $EncodedAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${User}:${Token}"))

            $issueKey = '${{ env.ISSUE_KEY }}'
            if (-not $issueKey -or $issueKey -eq 'null' -or $issueKey -eq '') {
            Write-Host "No ISSUE_KEY available; skipping Jira comment POST"
            exit 0
            }

            # Prepare the request body in JSON format
            $body = @{
              body = @{
                type = "doc"
                version = 1
                content = @(
                  @{
                    type = "paragraph"
                    content = @(
                    if ("${{vars.LANGUAGE}}" -eq "EN") {
                      @{
                        type = "text"
                        text = "Code Pipeline Information : The assignment ${{ steps.checkbuild2.outputs.ASSIGNMENT_ID || steps.checkbuild.outputs.ASSIGNMENT_ID }} has been created for this feature."
                      }
                    }
                    else {
                      @{
                        type = "text"
                        text = "Information Code Pipeline : L'assignment ${{ steps.checkbuild2.outputs.ASSIGNMENT_ID || steps.checkbuild.outputs.ASSIGNMENT_ID }} a été créé pour cette user story."
                      }
                    }
                   )
                  }
                )
              }
            } | ConvertTo-Json -Depth 5 -Compress

            # Display the JSON body for debugging purposes
            Write-Host "Request body: $body"

            # Send the POST request to Jira API
            try {
              $response = Invoke-WebRequest -Uri "${{ vars.JIRA_URL }}/rest/api/3/issue/$issueKey/comment" `
              -Method POST `
              -Headers @{
                'Accept' = 'application/json'
                'Authorization' = "Basic $EncodedAuth"
              } `
              -Body $body `
              -ContentType 'application/json' `
              -ErrorAction Stop
                } catch {
                  Write-Host ("Warning: Jira POST comment failed for issue {0}: {1}" -f $issueKey, $_.Exception.Message)
                }

      # Build (prefer checkbuild BuildJSON, else sync automaticBuildJson)
      - name: Prepare build JSON
        id: prepareBuild
        shell: pwsh
        run: |
          # Try several possible sources for the build JSON in priority order
          $check1 = '${{ steps.checkbuild.outputs.BuildJSON }}'
          $check2 = '${{ steps.checkbuild2.outputs.BuildJSON }}'
          $reSync = '${{ steps['re-sync'].outputs.automaticBuildJson }}'
          $sync   = '${{ steps.sync_final.outputs.automaticBuildJson }}'

          Write-Host "Lengths: check1=$($check1.Length) check2=$($check2.Length) reSync=$($reSync.Length) sync=$($sync.Length)"

          if ($check1 -and $check1 -ne 'null' -and $check1 -ne '') {
            $selected = $check1
            Write-Host "Selected: checkbuild"
          } elseif ($check2 -and $check2 -ne 'null' -and $check2 -ne '') {
            $selected = $check2
            Write-Host "Selected: checkbuild2"
          } elseif ($reSync -and $reSync -ne 'null' -and $reSync -ne '') {
            $selected = $reSync
            Write-Host "Selected: re-sync"
          } else {
            if (Test-Path -Path .\automaticBuildParams.txt -PathType Leaf) {
              Write-Host "automaticBuildParams.txt found in workspace, reading file"
              $selected = Get-Content .\automaticBuildParams.txt -Raw
              Write-Host "Selected: file"
            } else {
              $selected = $sync
              Write-Host "Selected: sync"
            }
          }

          # Export multiline-safe to GITHUB_OUTPUT
          Add-Content -Path $env:GITHUB_OUTPUT -Value "SELECTED_BUILD_JSON<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $selected
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

      - name: Build
        if: ${{ steps.prepareBuild.outputs.SELECTED_BUILD_JSON != '' }}
        uses: bmc-compuware/ispw-build@v1
        id: build
        with:
          ces_url: ${{ vars.CES_URL }}
          ces_token: ${{ secrets.CES_TOKEN }}
          srid: 'ispw'
          runtime_configuration: ${{ vars.CP_RUNTIME }}
          # selected build JSON prepared in prior step
          build_automatically: ${{ steps.prepareBuild.outputs.SELECTED_BUILD_JSON }}

      # Check for Failures
      - name: Get the number of build failures
        run: echo "The number of build failures is ${{ steps.build.outputs.generate_failed_count }}"


  Test:
      needs: Build
      runs-on: [ISPW]
      env:
        CLI_LOCATION : ${{ vars.CLI_LOCATION }}
        ASSIGNMENT_ID : ${{ needs.Build.outputs.ASSIGNMENT_ID }}
      outputs:
        RUN_DATE : ${{ steps.runDate.outputs.RUN_DATE }}
      steps:

      # Retrieve Timestamp as Test ID
      - name: Get Current Date
        id: runDate
        shell: pwsh
        run: |
          $timestamp = Get-Date -Format "yyyyMMddHHmmss"
          echo "RUN_DATE=$timestamp" >> $env:GITHUB_OUTPUT

      # Run Unit Tests
      - name: Run Unit Tests
        shell: pwsh
        id: runTests
        run: |
          & "${{ env.CLI_LOCATION }}/TotalTestFTCLI.bat" `
            -cp ${{ vars.TSO_CODE_PAGE }} `
            -host ${{ vars.HCI_HOST }} `
            -port ${{ vars.HCI_PORT }} `
            -cfgdir ${{ vars.TT_CONFIG }}  `
            -encrypt None `
            -u ${{ vars.TSO_USER }}  `
            -p ${{ secrets.TSO_TOKEN }} `
            -cesu ${{ vars.TSO_USER }}  `
            -cesp ${{ secrets.TSO_TOKEN }} `
            -f ${{ vars.TEST_FOLDER }} `
            -pnf changedPrograms.json `
            -ccrepo ${{ vars.CC_REPO }} `
            -ccsys ${{ env.ASSIGNMENT_ID }} `
            -cctid ${{ steps.runDate.outputs.RUN_DATE }} `
            -R -G -v 6 -loglevel INFO `
            -data "${{ github.workspace }}/cliWkspce"

      # Create Test Report with jUnit file
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Report
          path: ${{ vars.JUNIT_PATH }}
          reporter: java-junit
          fail-on-error: true

  CodeCoverage:
      needs: [Build,Test]
      runs-on: [ISPW]
      env:
        CLI_LOCATION : ${{ vars.CLI_LOCATION }}
        ASSIGNMENT_ID : ${{ needs.Build.outputs.ASSIGNMENT_ID }}
        RUN_DATE : ${{ needs.Test.outputs.RUN_DATE }}
      steps:

      # Retrieve Code Coverage Results
      - name: Code Coverage Export
        shell: pwsh
        id: codeCoverage
        run: |
             ${{ vars.CLI_LOCATION }}/CodeCoverageCLI.bat `
             -host "${{ vars.HCI_HOST }}" -port "${{ vars.HCI_PORT }}" -code "${{ vars.TSO_CODE_PAGE }}" -timeout "0" `
             -id "${{ vars.TSO_USER }}" -pass "${{ secrets.TSO_TOKEN }}" `
             -targetFolder "${{ github.workspace }}" -data "${{ github.workspace }}/cliWkspce" `
             --cc.repos "${{ vars.CC_REPO }}" `
             --cc.system "${{ env.ASSIGNMENT_ID }}" `
             --cc.test "${{ env.RUN_DATE }}" `
             --cc.sources "${{ vars.CC_SOURCES }}"     

  SonarQube:
      needs: CodeCoverage
      runs-on: [ISPW]
      steps:

      # Run SonarQube Scanner
      - name: SonarQube Analysis
        shell: pwsh
        run: |
          & "${{ vars.SONAR_PATH }}/sonar-scanner.bat" `
            "-Dsonar.projectKey=${{ vars.SONAR_PROJECT }}" `
            "-Dsonar.host.url=${{ vars.SONAR_URL }}" `
            "-Dsonar.token=${{ secrets.SONAR_TOKEN }} " `
            "-Dsonar.tests=${{ vars.SONAR_TESTS }}" `
            "-Dsonar.testExecutionReportPaths=${{ vars.SONAR_TESTEXEC_REPORT }}" `
            "-Dsonar.coverageReportPaths=${{ vars.SONAR_CC_REPORT }}" `
            "-Dsonar.sources=${{ vars.CC_SOURCES }}" `
            "-Dsonar.cobol.file.suffixes=cbl,testsuite,testscenario,context,stub" `
            "-Dsonar.cobol.copy.suffixes=cpy" `
            "-Dsonar.sourceEncoding=UTF-8" 
            "-Dsonar.qualitygate.wait=true"

  # Job for Release branch build
  release-branch-build:
   if: (startsWith(github.ref, 'refs/heads/release/'))
   runs-on: [self-hosted]
   env:
    Win_Topaz_Location: ${{ vars.CLI_LOCATION }}
   steps:
      - name: checkout step
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          
      - name: Sync code 
        shell: pwsh
        id: sync
        run: |
         $currentTag = (git tag --sort=-refname).Split("`n")[0].Trim()
         $previousTag = (git tag --sort=-refname).Split("`n")[1].Trim()
            
         $fromCommit = (git rev-list -1 $previousTag)
         $toCommit = (git rev-parse --verify HEAD)
            
         $currentCommit  = $toCommit
         $previousCommit = $fromCommit
         
         cmd.exe /c "${{ env.Win_Topaz_Location }}\IspwCLI.bat" -operation syncGitToIspw -gitLocalPath '.\' -data ${{ github.workspace }}\cliWkspce  -gitBranch ${{ github.ref_name }} -host ${{ vars.HCI_HOST }} -port  ${{ vars.HCI_PORT }} -id ${{ vars.TSO_USER }} -pass ${{ secrets.TSO_TOKEN }} -protocol None -code ${{ vars.TSO_CODE_PAGE }} -timeout 0 -ispwServerConfig ${{ vars.CP_RUNTIME }} -ispwConfigPath "GenApp_MainframeCore\ispwconfig-nosb.yml" -ispwServerStream ${{ vars.CP_STREAM }} -ispwServerApp ${{ vars.CP_APPL }} -ispwCheckoutLevel "RLSE" -ispwContainerCreation "per-branch" -assignmentPrefix ${{ vars.CP_ASSIGNPREFIX }} -gitRepoUrl "${{ github.server_url }}/${{ github.repository }}.git" -gitFromHash $previousCommit -gitCommit $currentCommit 
    
      - name: Check Build Parms
        shell: pwsh
        id: checkbuild
        run: |
          if(-not (Test-Path -Path .\automaticBuildParams.txt -PathType Leaf)) {
 
           Write-Host "No Mainframe Build parameters were found. Likely, no MF components were modified. The build will continue and just execute a code scan."
           Write-Host "##vso[task.complete result=Failed;]DONE"
          }
          else {
 
           Write-Host "Mainframe Build parameters were found. Will continue with full Mainframe Build process."
         
           [string]$fileContent  = ''          
           $fileContent          = Get-Content .\automaticBuildParams.txt
           $content              = ''
 
           foreach ($line in $fileContent) { $content = $content + "`n" + $line }
           
           $json                 = ConvertFrom-JSON $content
 
           $taskParm             = ""
 
           foreach($taskId in $json.taskIds) {
               $taskParm = $taskParm + $taskId + ","
           }
 
           $taskParm = $taskParm.Substring(0,$taskParm.Length - 1)
 
           $taskLevel    = $json.taskLevel
           $assignmentId = $json.containerId

           Write-Host "Build JSON: " 
           Write-Host $fileContent
           Write-Host "Identified" 
           Write-Host "  Tasks"
           Write-Host $taskParm
           Write-Host "  Assignment"
           Write-Host $assignmentId
           Write-Host "  Level"
           Write-Host $taskLevel
 
           Write-Host "##vso[task.setvariable variable=taskIds;isoutput=true]$taskParm"
           Write-Host "##vso[task.setvariable variable=taskLevel;isoutput=true]$taskLevel"
           Write-Host "##vso[task.setvariable variable=assignmentId;isoutput=true]$assignmentId"
           echo "BuildJSON=$fileContent" >> $env:GITHUB_OUTPUT

           Write-Host $fileContent
          }
 
      - name: Build
        if: ${{ steps.prepareBuild.outputs.SELECTED_BUILD_JSON != '' }}
        uses: bmc-compuware/ispw-build@v1
        id: build
        with:
          ces_url: ${{ vars.CES_URL }}
          ces_token: ${{ secrets.CES_TOKEN }}
          srid: 'ispw'
          runtime_configuration: ${{ vars.CP_RUNTIME }}
          build_automatically: ${{ steps.checkbuild.outputs.BuildJSON != '' && steps.checkbuild.outputs.BuildJSON || steps.sync_final.outputs.automaticBuildJson }}
          
      - name: Get the number of build failures
        run: echo "The number of build failures is ${{ steps.build.outputs.generate_failed_count }}"
             
      - name: Run Tests
        run: echo "Ran Tests successfully!"

