
name: Feature Branch Creation

on:
  repository_dispatch:
    types: [jira-progress]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  Branch-Creation:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
    
    # Checkout the repository first 
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name : branch creation
      id: branchCreate
      uses: peterjgrainger/action-create-branch@v2.2.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        branch: 'feature/${{ github.event.client_payload.issue_key }}'

  SonarQube :
      needs: Branch-Creation
      runs-on: [ISPW]
      steps:

      # Run SonarQube Scanner
      - name: SonarQube Analysis
        shell: pwsh
        run: |
              $branch = git rev-parse --abbrev-ref HEAD
              $env:SONAR_SCANNER_PROVISIONING_ENABLE = "false"
              $scannerPath = "${{ vars.SONAR_PATH }}/sonar-scanner.bat"
              $args = @(
                "-X",
                "-Dsonar.projectKey=${{ vars.SONAR_PROJECT }}",
                "-Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}",
                "-Dsonar.host.url=${{ vars.SONAR_URL }}",
                "-Dsonar.token=${{ secrets.SONAR_TOKEN }}",
                "-Dsonar.branch.name=$branch",
                "-Dsonar.tests=${{ vars.SONAR_TESTS }}",
                "-Dsonar.testExecutionReportPaths=${{ vars.SONAR_TESTEXEC_REPORT }}",
                "-Dsonar.coverageReportPaths=${{ vars.SONAR_CC_REPORT }}",
                "-Dsonar.sources=${{ vars.CC_SOURCES }}",
                "-Dsonar.cobol.file.suffixes=cbl,testsuite,testscenario,context,stub",
                "-Dsonar.cobol.copy.suffixes=cpy",
                "-Dsonar.sourceEncoding=UTF-8",
                "-Dsonar.scanner.provisioning.enable=false"
              )

              & $scannerPath @args

              
              Write-Host "Executing:"
              Write-Host "$scannerPath $($args -join ' ')"


      # $cmd = "${{ vars.SONAR_PATH }}/sonar-scanner.bat -X " +
