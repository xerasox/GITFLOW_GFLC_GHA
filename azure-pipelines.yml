trigger: none  # Manual trigger only

parameters:
- name: AssignmentID
  displayName: 'Enter Assignment ID'
  type: string

variables:
- group: 'GITFLOW_GFLC'

pool:
  name: 'Default'

stages:
- stage: RLSE
  displayName: 'Deploy to RLSE'
  jobs:
  - deployment: DeployRLSE
    environment: RLSE
    strategy:
      runOnce:
       deploy:
          steps:
          - task: Bash@3
            displayName: 'Call CES API (macOS via curl)'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail

                url="${cesUrl}/ispw/${runtimeConfig}/assignments/${{ parameters.AssignmentID }}/tasks/promote?level=FEAT"

                echo "Calling CES API: ${url}"

                # Build JSON body safely. Use a here-doc to avoid escaping issues.
                read -r -d '' body <<'JSON'
                {
                  "runtimeConfiguration": "__RUNTIME_CONFIG__"
                }
                JSON

                # Inject runtime value into JSON body
                body="${body/__RUNTIME_CONFIG__/${runtimeConfig}}"

                # Optional: show body for debugging (do not print tokens)
                echo "Request body: ${body}"

                # Perform POST request
                curl -sS -X POST \
                  -H "Authorization: ${CES_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data "${body}" \
                  "${url}" \
                  -w "\nHTTP %{http_code}\n"

- stage: PREP
  displayName: 'Deploy to PREP'
  dependsOn: RLSE
  condition: succeeded()
  jobs:
  - deployment: DeployPREP
    environment: PREP
    strategy:
      runOnce:
        deploy:
          steps:
           - task: PowerShell@2
             displayName: 'Call CES API'
             inputs:
              targetType: 'inline'
              script: |
                        $headers = @{
                            "Authorization" = "$(CES_TOKEN)"
                            "Content-Type" = "application/json"
                        }

                        $body = @{
                            "runtimeConfiguration" = "$(runtimeConfig)"
                        } | ConvertTo-Json -Depth 10

                        $url = "$(cesUrl)/ispw/$(runtimeConfig)/assignments/${{ parameters.AssignmentID }}/tasks/promote?level=RLSE"

                        Write-Host "Calling CES API: $url"
                        Invoke-WebRequest -Uri $url `
                                          -Method POST `
                                          -Headers $headers `
                                          -Body $body `
                                          -ContentType "application/json"

- stage: PROD
  displayName: 'Deploy to PROD'
  dependsOn: PREP
  condition: succeeded()
  jobs:
  - deployment: DeployPROD
    environment: PROD
    strategy:
      runOnce:
        deploy:
          steps:
           - task: PowerShell@2
             displayName: 'Call CES API'
             inputs:
              targetType: 'inline'
              script: |
                        $headers = @{
                            "Authorization" = "$(CES_TOKEN)"
                            "Content-Type" = "application/json"
                        }

                        $body = @{
                            "runtimeConfiguration" = "$(runtimeConfig)"
                        } | ConvertTo-Json -Depth 10

                        $url = "$(cesUrl)/ispw/$(runtimeConfig)/assignments/${{ parameters.AssignmentID }}/tasks/promote?level=PREP"

                        Write-Host "Calling CES API: $url"
                        $response = Invoke-WebRequest -Uri $url `
                                                      -Method POST `
                                                      -Headers $headers `
                                                      -Body $body `
                                                      -ContentType "application/json"

                        # Parse JSON
                        $content = $response.Content | ConvertFrom-Json

                        # Extract the setId
                        $setId = $content.setId

                        Write-Host "Extracted setId: $setId"

                        # # Example: Use setId in another API call
                        # $nextUrl = "$(cesUrl)/ispw/$(runtimeConfig)/sets/$setId/approve?approver=GFLCAPPR"

                        # Write-Host "Calling CES API: $nextUrl"
