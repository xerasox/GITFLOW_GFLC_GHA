trigger: none  # Manual trigger only

parameters:
- name: AssignmentID
  displayName: 'Enter Assignment ID'
  type: string

variables:
- group: 'GITFLOW_GFLC'

pool:
  name: 'Default'

stages:
- stage: Dev
  displayName: 'Deploy to Dev'
  jobs:
  - deployment: DeployDev
    environment: Dev
    strategy:
      runOnce:
       deploy:
          steps:
           - task: PowerShell@2
             displayName: 'Call CES API'
             inputs:
              targetType: 'inline'
              script: |
                        $headers = @{
                            "Authorization" = "$(CES_TOKEN)"
                            "Content-Type" = "application/json"
                        }

                        $body = @{
                            "runtimeConfiguration" = "$(runtimeConfig)"
                        } | ConvertTo-Json -Depth 10

                        $url = "$(cesUrl)/ispw/$(runtimeConfig)/assignments/${{ parameters.AssignmentID }}/tasks/promote?level=FEAT"

                        Write-Host "Calling CES API: $url"
                        Invoke-WebRequest -Uri $url `
                                          -Method POST `
                                          -Headers $headers `
                                          -Body $body `
                                          -ContentType "application/json"

- stage: QA
  displayName: 'Deploy to QA'
  dependsOn: Dev
  condition: succeeded()
  jobs:
  - deployment: DeployQA
    environment: QA
    strategy:
      runOnce:
        deploy:
          steps:
           - task: PowerShell@2
             displayName: 'Call CES API'
             inputs:
              targetType: 'inline'
              script: |
                        $headers = @{
                            "Authorization" = "$(CES_TOKEN)"
                            "Content-Type" = "application/json"
                        }

                        $body = @{
                            "runtimeConfiguration" = "$(runtimeConfig)"
                        } | ConvertTo-Json -Depth 10

                        $url = "$(cesUrl)/ispw/$(runtimeConfig)/assignments/${{ parameters.AssignmentID }}/tasks/promote?level=RLSE"

                        Write-Host "Calling CES API: $url"
                        Invoke-WebRequest -Uri $url `
                                          -Method POST `
                                          -Headers $headers `
                                          -Body $body `
                                          -ContentType "application/json"

- stage: Prod
  displayName: 'Deploy to Prod'
  dependsOn: QA
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    environment: Prod
    strategy:
      runOnce:
        deploy:
          steps:
           - task: PowerShell@2
             displayName: 'Call CES API'
             inputs:
              targetType: 'inline'
              script: |
                        $headers = @{
                            "Authorization" = "$(CES_TOKEN)"
                            "Content-Type" = "application/json"
                        }

                        $body = @{
                            "runtimeConfiguration" = "$(runtimeConfig)"
                        } | ConvertTo-Json -Depth 10

                        $url = "$(cesUrl)/ispw/$(runtimeConfig)/assignments/${{ parameters.AssignmentID }}/tasks/promote?level=PREP"

                        Write-Host "Calling CES API: $url"
                        Invoke-WebRequest -Uri $url `
                                          -Method POST `
                                          -Headers $headers `
                                          -Body $body `
                                          -ContentType "application/json"

                        # Parse the JSON content
                        $content = $response.Content | ConvertFrom-Json

                        # Extract the setId
                        $setId = $content.setId

                        Write-Host "Extracted setId: $setId"

                        # Example: Use setId in another API call
                        $nextUrl = "$(CES_URL)/ispw/$(CP_RUNTIME)/sets/$setId/approve?approver=GFLCAPPR"

                        Write-Host "Calling CES API: $nextUrl"
                        Invoke-WebRequest -Uri $nextUrl `
                                          -Method POST `
                                          -Headers $headers `
                                          -Body $body `
                                          -ContentType "application/json"

