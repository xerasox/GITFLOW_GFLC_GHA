trigger: none  # Manual trigger only

parameters:
- name: AssignmentID
  displayName: 'Enter Assignment ID'
  type: string

variables:
- group: 'GITFLOW_GFLC'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Dev
  displayName: 'Deploy to Dev'
  jobs:
  - deployment: DeployDev
    environment: Dev
    strategy:
      runOnce:
       deploy:
          steps:
          - task: azure-deveops-ispw-operation-task@2
            displayName: Promote
            inputs:
              connectionId: $(hostConnection)
              operationType: 'CES'
              cesUrl: $(cesUrl)
              cesSecretToken: $(CES_TOKEN)
              action: 'PromoteAssignment'
              request: |
                runtimeConfiguration=$(runtimeConfig)
                assignmentId=${{ parameters.AssignmentID }}
                application=GITFLOWC
                level=FEAT
              skipWaitingForSetCompletion: false
              showResponseBodyInConsole: true

- stage: QA
  displayName: 'Deploy to QA'
  dependsOn: Dev
  condition: succeeded()
  jobs:
  - deployment: DeployQA
    environment: QA
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
                       echo "Deploying to QA with Assignment ID : ${{ parameters.AssignmentID }}"

- stage: Prod
  displayName: 'Deploy to Prod'
  dependsOn: QA
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    environment: Prod
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
                       echo "Deploying to Prod with Assignment ID : ${{ parameters.AssignmentID }}"
