trigger: none  # Manual trigger only

parameters:
- name: AssignmentID
  displayName: 'Enter Assignment ID'
  type: string

variables:
- group: 'GITFLOW_GFLC'

pool:
  name: 'Default'

stages:
- stage: RLSE
  displayName: 'Deploy to RLSE'
  jobs:
  - deployment: DeployRLSE
    environment: RLSE
    strategy:
      runOnce:
       deploy:
          steps:
           - task: PowerShell@2
             displayName: 'Call CES API'
             inputs:
              targetType: 'inline'
              script: |
                        $headers = @{
                            "Authorization" = "$(CES_TOKEN)"
                            "Content-Type" = "application/json"
                        }

                        $body = @{
                            "runtimeConfiguration" = "$(runtimeConfig)"
                        } | ConvertTo-Json -Depth 10

                        $url = "$(cesUrl)/ispw/$(runtimeConfig)/assignments/${{ parameters.AssignmentID }}/tasks/promote?level=FEAT"

                        Write-Host "Calling CES API: $url"
                        Invoke-WebRequest -Uri $url `
                                          -Method POST `
                                          -Headers $headers `
                                          -Body $body `
                                          -ContentType "application/json"

- stage: PREP
  displayName: 'Deploy to PREP'
  dependsOn: RLSE
  condition: succeeded()
  jobs:
  - deployment: DeployPREP
    environment: PREP
    strategy:
      runOnce:
        deploy:
          steps:
           - task: PowerShell@2
             displayName: 'Call CES API'
             inputs:
              targetType: 'inline'
              script: |
                        $headers = @{
                            "Authorization" = "$(CES_TOKEN)"
                            "Content-Type" = "application/json"
                        }

                        $body = @{
                            "runtimeConfiguration" = "$(runtimeConfig)"
                        } | ConvertTo-Json -Depth 10

                        $url = "$(cesUrl)/ispw/$(runtimeConfig)/assignments/${{ parameters.AssignmentID }}/tasks/promote?level=RLSE"

                        Write-Host "Calling CES API: $url"
                        Invoke-WebRequest -Uri $url `
                                          -Method POST `
                                          -Headers $headers `
                                          -Body $body `
                                          -ContentType "application/json"

- stage: PROD
  displayName: 'Deploy to PROD'
  dependsOn: PREP
  condition: succeeded()
  jobs:
  - deployment: DeployPROD
    environment: PROD
    strategy:
      runOnce:
        deploy:
          steps:
           - task: PowerShell@2
             displayName: 'Call CES API'
             inputs:
              targetType: 'inline'
              script: |
                        $headers = @{
                            "Authorization" = "$(CES_TOKEN)"
                            "Content-Type" = "application/json"
                        }

                        $body = @{
                            "runtimeConfiguration" = "$(runtimeConfig)"
                        } | ConvertTo-Json -Depth 10

                        $url = "$(cesUrl)/ispw/$(runtimeConfig)/assignments/${{ parameters.AssignmentID }}/tasks/promote?level=PREP"

                        Write-Host "Calling CES API: $url"
                        $response = Invoke-WebRequest -Uri $url `
                                                      -Method POST `
                                                      -Headers $headers `
                                                      -Body $body `
                                                      -ContentType "application/json"

                        # Parse JSON
                        $content = $response.Content | ConvertFrom-Json

                        # Extract the setId
                        $setId = $content.setId

                        Write-Host "Extracted setId: $setId"

                        # # Example: Use setId in another API call
